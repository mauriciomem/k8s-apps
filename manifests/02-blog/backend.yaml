---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: blog
  labels:
    app: blog
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog
      tier: backend
  template:
    metadata:
      labels:
        app: blog
        tier: backend
    spec:
      containers:
        - name: backend
          image: cks-lab/api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAME
              value: "Blog"
            - name: DB_HOST
              value: "database"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "app"
            - name: DB_USER
              value: "app"
            - name: DB_PASSWORD
              value: "blog-pass-456"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: blog
  labels:
    app: blog
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: blog
    tier: backend
  ports:
    - port: 8080
      targetPort: 8080
