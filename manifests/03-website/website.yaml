---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
  labels:
    app: website
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
      tier: frontend
  template:
    metadata:
      labels:
        app: website
        tier: frontend
    spec:
      containers:
        - name: website
          image: cks-lab/static-site:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: website
  labels:
    app: website
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: website
    tier: frontend
  ports:
    - port: 8080
      targetPort: 8080
