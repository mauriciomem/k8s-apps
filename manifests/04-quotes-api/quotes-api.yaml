---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes-api
  namespace: quotes-api
  labels:
    app: quotes-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quotes-api
      tier: backend
  template:
    metadata:
      labels:
        app: quotes-api
        tier: backend
    spec:
      containers:
        - name: quotes-api
          image: cks-lab/static-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quotes-api
  namespace: quotes-api
  labels:
    app: quotes-api
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: quotes-api
    tier: backend
  ports:
    - port: 8080
      targetPort: 8080
