---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: shop
  labels:
    app: shop
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
      tier: database
  template:
    metadata:
      labels:
        app: shop
        tier: database
    spec:
      containers:
        - name: database
          image: cks-lab/db:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              value: "shop-pass-123"
            - name: POSTGRES_DB
              value: "app"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: shop
  labels:
    app: shop
    tier: database
spec:
  type: ClusterIP
  selector:
    app: shop
    tier: database
  ports:
    - port: 5432
      targetPort: 5432
